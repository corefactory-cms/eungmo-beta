<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f7f6">
  <meta name="description" content="경품 행사의 응모 조건과 공식 발표를 확인하고, 내 응모와 당첨 결과를 이 기기에 기록하세요.">
  <meta name="referrer" content="no-referrer">
  <link rel="icon" href="./icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="./icon-180.png">
  <link rel="manifest" href="./app.webmanifest">
  <link rel="stylesheet" href="./style.css">
  <script defer src="./app.js"></script>
  <title>응모수첩</title>
</head>
<body>
  <header class="header"><div class="shell head-inner">
    <a href="#discover" class="brand" aria-label="응모수첩 처음 화면"><span class="brand-mark" aria-hidden="true"></span>응모수첩</a>
    <button type="button" data-refresh class="refresh"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 7v5h-5M5 17v-5h5"/><path d="M6.6 8.3a6.4 6.4 0 0 1 10.2-2L19 9M5 15l2.3 2.7a6.4 6.4 0 0 0 10.3-2"/></svg><span>공고 갱신</span></button>
  </div></header>
  <div class="shell body-grid"><main id="main" tabindex="-1"><h1>응모 둘러보기</h1><p>공고를 불러오는 중이에요.</p></main></div>
  <nav class="bottom" aria-label="주 메뉴"><div class="shell nav-inner">
    <a href="#discover" data-route="discover"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="m15.8 8.2-2.3 5.3-5.3 2.3 2.3-5.3z"/></svg>발견</a>
    <a href="#entries" data-route="entries"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 6.5h17v3.8a2 2 0 0 0 0 3.5v3.7h-17v-3.7a2 2 0 0 0 0-3.5zM8.5 8.3v1.8m0 3.6v1.8"/></svg>내 응모</a>
    <a href="#results" data-route="results"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="6" width="17" height="13" rx="2.3"/><path d="m4.5 7 7.5 5.7L19.5 7"/></svg>내 결과</a>
  </div></nav>
  <dialog id="detail" aria-labelledby="detail-title"><div id="detail-body"></div></dialog>
  <div id="status" role="status" aria-live="polite"></div>
  <noscript>공고 목록을 보려면 브라우저의 자바스크립트를 켜 주세요.</noscript>
</body>
</html>
